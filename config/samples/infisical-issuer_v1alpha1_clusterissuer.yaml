# Example ClusterIssuer using Kubernetes Auth.
# The issuer mints a short-lived token for the referenced service account and
# presents it to Infisical. The machine identity ID is read from a Secret.
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: clusterissuer-infisical
spec:
  url: "https://app.infisical.com"
  application: "istio-workloads"
  profile: "mesh-mtls"
  authentication:
    method: kubernetes
    kubernetes:
      identityIdRef:
        name: "infisical-identity"
        namespace: "infisical-issuer"
        key: "identityId"
      serviceAccountRef:
        name: "infisical-issuer-auth"
        namespace: "infisical-issuer"
      serviceAccountTokenAudiences:
        - "infisical"
