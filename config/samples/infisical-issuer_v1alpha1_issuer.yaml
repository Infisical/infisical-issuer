# Example Issuer using Universal Auth (client ID and secret).
# Both credentials live in the referenced Secret (see secret_issuer.yaml).
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: Issuer
metadata:
  name: issuer-infisical
  namespace: default
spec:
  url: "https://app.infisical.com"
  application: "my-application"
  profile: "my-profile"
  authentication:
    method: universal
    universal:
      clientIdRef:
        name: "issuer-infisical-credentials"
        namespace: "default"
        key: "clientId"
      clientSecretRef:
        name: "issuer-infisical-credentials"
        namespace: "default"
        key: "clientSecret"
