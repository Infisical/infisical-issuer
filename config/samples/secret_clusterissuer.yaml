# Machine identity ID for the Kubernetes-auth ClusterIssuer. The ID is not a
# secret, but it is referenced the same way the Infisical operator does it.
#
#   kubectl create secret generic infisical-identity \
#     --namespace infisical-issuer \
#     --from-literal=identityId=<machine-identity-id>
apiVersion: v1
kind: Secret
metadata:
  name: infisical-identity
  namespace: infisical-issuer
stringData:
  identityId: "<machine-identity-id>"
