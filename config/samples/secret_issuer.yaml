# Universal Auth credentials for the Issuer. Both the client ID and the client
# secret live in this one Secret, referenced by clientIdRef / clientSecretRef.
#
#   kubectl create secret generic issuer-infisical-credentials \
#     --namespace default \
#     --from-literal=clientId=<client-id> \
#     --from-literal=clientSecret=<client-secret>
apiVersion: v1
kind: Secret
metadata:
  name: issuer-infisical-credentials
  namespace: default
stringData:
  clientId: "<client-id>"
  clientSecret: "<client-secret>"
