apiVersion: v1
kind: Service
metadata:
  name: {{ include "infisical-pki-issuer.fullname" . }}-controller-metrics
  labels:
    control-plane: controller-manager
  {{- include "infisical-pki-issuer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controllerMetrics.type }}
  selector:
    control-plane: controller-manager
    {{- include "infisical-pki-issuer.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.controllerMetrics.ports | toYaml | nindent 2 }}
