apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "infisical-pki-issuer.fullname" . }}-issuer-viewer-role
  labels:
  {{- include "infisical-pki-issuer.labels" . | nindent 4 }}
rules:
- apiGroups:
  - infisical-issuer.infisical.com
  resources:
  - issuers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - infisical-issuer.infisical.com
  resources:
  - issuers/status
  verbs:
  - get
